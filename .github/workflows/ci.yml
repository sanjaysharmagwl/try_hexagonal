name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, labeled, unlabeled, reopened]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest --cov=app --cov=tools/cp --cov-report=term-missing
      - run: uv run python tools/cp/cp lint
      - run: uv run python harness/checks/run_all.py

  cp-reference:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Check PR references an In-Progress CP
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          CHANGED_FILES="$(git diff --name-only origin/${{ github.base_ref }}...HEAD)"
          export CHANGED_FILES
          uv run python harness/checks/check_pr_reference.py
