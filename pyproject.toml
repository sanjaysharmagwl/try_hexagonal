[project]
name = "idea-management-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff>=0.17.3",
    "pyright",
    "import-linter",
]

[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[tool.uv.sources]
core = { workspace = true }
api = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
# Style-only modernization suppressed: no application behavior changes allowed.
"packages/core/src/core/ideas/models.py" = ["UP042"]
"apps/api/src/api/ideas/router.py" = ["B904"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["apps/api/tests", "packages/core/tests", "docs/checks/tests"]

[tool.pyright]
include = ["apps", "packages"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.importlinter]
root_packages = ["core", "api"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core must not depend on api or web frameworks"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["api", "fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "api feature layers: router -> service/schemas, never repository"
type = "forbidden"
source_modules = ["api.ideas.router"]
forbidden_modules = ["core.ideas.repository"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "core feature layers flow downward"
type = "layers"
containers = ["core.ideas"]
layers = ["service", "repository", "models"]
