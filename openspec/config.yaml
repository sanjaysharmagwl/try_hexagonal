schema: spec-driven

# Project context
context: |
  Python 3.12 project managed with uv.
  FastAPI + Pydantic application following hexagonal architecture
  (domain, application use cases, adapters wired in the composition root).
  Layering rules live in harness/standards/architecture.md and are
  enforced by harness/checks.
  The non-negotiable principles are in harness/constitution.md.
  Tests use pytest.
  Do not add new dependencies without a change that justifies them.

# Per-artifact rules
rules:
  proposal:
    - State Non-goals / out of scope explicitly
  specs:
    - Every requirement uses SHALL or MUST
    - Every requirement has at least one WHEN/THEN scenario
  tasks:
    - Each task is small and includes its tests
    - The final task runs the repo checks: ruff format --check, ruff check, pytest, openspec validate --all --strict, harness/checks/run_all.py
