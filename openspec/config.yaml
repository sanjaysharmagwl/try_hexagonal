schema: spec-driven

# Project context
context: |
  Python 3.12 uv workspace.
  Feature-sliced layered FastAPI app: business logic in packages/core
  (models, service, repository — no web framework), HTTP in apps/api
  (routers, schemas, deps, main). Wired via FastAPI Depends providers.
  Layering rules live in docs/standards/architecture.md and are
  enforced by import-linter (just arch) plus docs/checks.
  The non-negotiable principles are in docs/constitution.md.
  Tests use pytest.
  Do not add new dependencies without a change that justifies them.

# Per-artifact rules
rules:
  proposal:
    - State Non-goals / out of scope explicitly
  specs:
    - Every requirement uses SHALL or MUST
    - Every requirement has at least one WHEN/THEN scenario
  tasks:
    - Each task is small and includes its tests
    - The final task runs the repo checks: just check
