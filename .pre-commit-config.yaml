# Minimal local hooks. Install with: uvx pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: cp-lint
        name: cp lint
        entry: uv run python tools/cp/cp lint
        language: system
        files: ^proposals/
        pass_filenames: false
