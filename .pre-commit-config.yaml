# Minimal local hooks. Install with: uvx pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: openspec-validate
        name: openspec validate
        entry: npx -y @fission-ai/openspec@1.15.0 validate --all --strict --no-interactive
        language: system
        files: ^openspec/
        pass_filenames: false
